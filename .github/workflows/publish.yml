name: Publish Package

on:
  push:
    branches: ["main"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 24 ships with npm 11.x — needed for npm Trusted Publishing
      # (>= 11.5.1). Avoids the broken in-place `npm i -g npm@latest` on the
      # Node 22 image.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run -r build
      - run: pnpm run -r test

      - name: Publish
        run: pnpm --filter='./packages/*' publish --access public --no-git-checks --provenance

      # Install each published package alone, with --omit=dev, and import it. A build and a
      # test both run inside the dev tree, where an undeclared dependency is present anyway --
      # so neither can catch the defect that shipped axios in 1.1.1 and 500'd every request to
      # the demo's frontend until rollback. Only a clean production install can.
      - name: Verify each published package installs and imports on its own
        run: node scripts/verify-production-install.mjs
